[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "auto-course-contracts",
    "celery[redis]>=5.6.3",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
auto-course-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "auto_course_api"
